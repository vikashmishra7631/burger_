<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bistro &amp; Stack — Store Admin &amp; Orders Management</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              500: '#ea580c',
              600: '#c2410c',
              dark: '#1c1917',
              accent: '#d97706'
            },
            surface: {
              cream: '#faf9f6',
              card: '#ffffff',
              border: '#e7e5e4',
              muted: '#78716c'
            }
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
    body { background-color: #f5f4f0; color: #1c1917; font-family: 'Plus Jakarta Sans', sans-serif; }
    .clean-card { background: #ffffff; border: 1px solid rgba(231,229,228,0.9); transition: all 0.25s cubic-bezier(0.16,1,0.3,1); }

    /* Scrollable filter pills on mobile */
    .filter-scroll { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .filter-scroll::-webkit-scrollbar { display: none; }

    /* Status action buttons wrap on mobile */
    .status-actions { display: flex; flex-wrap: wrap; gap: 6px; }

    /* Financial row wraps on very small screens */
    .fin-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- ── TOP NAV ── -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-surface-border shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-2">

      <!-- Brand -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-brand-500 text-white flex items-center justify-center shadow-md">
          <i data-lucide="shield" class="w-4 h-4 fill-white"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-heading font-extrabold text-base sm:text-lg tracking-tight text-brand-dark flex items-center gap-1.5 flex-wrap">
            Bistro<span class="text-brand-500">&</span>Stack
            <span class="bg-brand-dark text-white text-[9px] uppercase font-bold px-1.5 py-0.5 rounded-full tracking-wider">Admin</span>
          </h1>
          <!-- Live status shown inline on mobile to save space -->
          <div class="flex items-center gap-1.5 text-[10px] text-stone-500">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping shrink-0"></span>
            <span id="sync-status" class="truncate">Live Connected</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button
          onclick="fetchOrders()"
          class="flex items-center gap-1 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold px-2.5 py-2 rounded-xl border border-stone-200 transition"
          title="Refresh"
        >
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Refresh</span>
        </button>

        <a
          href="/"
          class="flex items-center gap-1 bg-brand-500 hover:bg-brand-600 text-white text-xs font-bold px-2.5 py-2 rounded-xl shadow-md transition"
        >
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Store</span>
        </a>

        <button
          id="admin-logout-btn"
          onclick="adminLogout()"
          class="flex items-center gap-1 bg-stone-800 hover:bg-red-600 text-white text-xs font-semibold px-2.5 py-2 rounded-xl transition shadow-sm"
          title="Sign out"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span class="hidden sm:inline">Lock</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ── ADMIN LOGIN MODAL ── -->
  <div id="admin-auth-modal" class="fixed inset-0 z-50 bg-stone-950/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full rounded-3xl border border-surface-border shadow-2xl p-6 space-y-5">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-brand-500 text-white flex items-center justify-center mx-auto shadow-md">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="font-heading font-extrabold text-xl text-brand-dark">Store Admin Access</h2>
        <p class="text-xs text-stone-500">Enter your store manager passcode to manage kitchen orders.</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
        <div>
          <label class="block text-stone-700 font-semibold mb-1.5">Admin Passcode</label>
          <input
            type="password"
            id="admin-passcode-input"
            placeholder="Enter passcode (Default: bistro2026)"
            required
            class="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-3 text-brand-dark text-sm focus:outline-none focus:border-brand-500 font-mono text-center tracking-widest"
          />
        </div>
        <div id="admin-auth-error" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-xl border border-red-200 text-center font-medium"></div>
        <button
          type="submit"
          class="w-full py-3.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-heading font-bold text-sm shadow-md transition active:scale-95"
        >
          Unlock Kitchen Dashboard
        </button>
      </form>

      <div class="text-center text-[11px] text-stone-400">
        Demo passcode: <code class="bg-stone-100 text-brand-dark px-1.5 py-0.5 rounded font-mono font-bold">bistro2026</code>
      </div>
    </div>
  </div>

  <!-- ── MAIN CONTENT ── -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 pt-5 space-y-4">

    <!-- KPI Cards — 2 cols on mobile, 4 on large -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">

      <div class="clean-card p-4 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-stone-500">Orders</span>
          <i data-lucide="shopping-bag" class="w-4 h-4 text-brand-500 shrink-0"></i>
        </div>
        <div class="font-heading text-2xl sm:text-3xl font-extrabold text-brand-dark" id="metric-total-orders">0</div>
        <p class="text-[10px] text-emerald-600 font-medium mt-0.5">Live total</p>
      </div>

      <div class="clean-card p-4 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-stone-500">Revenue</span>
          <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-600 shrink-0"></i>
        </div>
        <div class="font-heading text-2xl sm:text-3xl font-extrabold text-brand-dark" id="metric-total-revenue">$0</div>
        <p class="text-[10px] text-stone-500 font-medium mt-0.5">Incl. tips</p>
      </div>

      <div class="clean-card p-4 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-stone-500">In Kitchen</span>
          <i data-lucide="flame" class="w-4 h-4 text-brand-500 animate-pulse shrink-0"></i>
        </div>
        <div class="font-heading text-2xl sm:text-3xl font-extrabold text-brand-500" id="metric-in-kitchen">0</div>
        <p class="text-[10px] text-stone-500 font-medium mt-0.5">Cooking now</p>
      </div>

      <div class="clean-card p-4 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[10px] font-bold uppercase tracking-wider text-stone-500">On Road</span>
          <i data-lucide="bike" class="w-4 h-4 text-brand-accent shrink-0"></i>
        </div>
        <div class="font-heading text-2xl sm:text-3xl font-extrabold text-stone-800" id="metric-in-transit">0</div>
        <p class="text-[10px] text-stone-500 font-medium mt-0.5">Dispatched</p>
      </div>

    </div>

    <!-- Filter & Search -->
    <div class="clean-card p-3 sm:p-4 rounded-2xl shadow-sm space-y-3">

      <!-- Status filter pills — horizontally scrollable -->
      <div class="filter-scroll text-xs font-semibold">
        <span class="shrink-0 text-stone-500 self-center">Status:</span>
        <button onclick="filterStatus('ALL')"       class="status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-brand-dark text-white"    data-status="ALL">All</button>
        <button onclick="filterStatus('RECEIVED')"  class="status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600" data-status="RECEIVED">📥 Received</button>
        <button onclick="filterStatus('PREPARING')" class="status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600" data-status="PREPARING">🔥 Cooking</button>
        <button onclick="filterStatus('IN_TRANSIT')"class="status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600" data-status="IN_TRANSIT">🚴 Transit</button>
        <button onclick="filterStatus('DELIVERED')" class="status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600" data-status="DELIVERED">✅ Done</button>
      </div>

      <!-- Search -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input
          type="text"
          id="admin-search-input"
          placeholder="Search order ID, name, phone..."
          oninput="handleSearch(this.value)"
          class="w-full bg-stone-50 border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs text-brand-dark focus:outline-none focus:border-brand-500"
        />
      </div>

    </div>

    <!-- Orders List -->
    <div class="space-y-3" id="orders-list-container">
      <div class="p-12 text-center text-stone-400">
        <div class="w-10 h-10 rounded-full border-4 border-stone-200 border-t-brand-500 animate-spin mx-auto mb-3"></div>
        <p class="text-xs font-medium">Loading orders...</p>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = window.location.origin.includes('localhost') ? window.location.origin : 'http://localhost:5000';
    let allOrders = [];
    let currentFilter = 'ALL';
    let searchQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth();
      lucide.createIcons();
      setInterval(fetchOrders, 8000);
    });

    /* ─── DATA ─────────────────────────────────── */
    async function fetchOrders() {
      try {
        const res  = await fetch(`${API_BASE}/api/orders`);
        const json = await res.json();
        if (json.success && Array.isArray(json.data)) {
          allOrders = json.data;
          updateMetrics();
          renderOrders();
          document.getElementById('sync-status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
        }
      } catch (err) {
        document.getElementById('sync-status').textContent = 'Sync Offline';
      }
    }

    /* ─── METRICS ───────────────────────────────── */
    function updateMetrics() {
      const rev = allOrders.reduce((s, o) => s + (o.pricing?.grandTotal || 0), 0);
      document.getElementById('metric-total-orders').textContent  = allOrders.length;
      document.getElementById('metric-total-revenue').textContent = `$${rev.toFixed(0)}`;
      document.getElementById('metric-in-kitchen').textContent    = allOrders.filter(o => o.status === 'PREPARING' || o.status === 'RECEIVED').length;
      document.getElementById('metric-in-transit').textContent    = allOrders.filter(o => o.status === 'IN_TRANSIT').length;
    }

    /* ─── FILTER / SEARCH ───────────────────────── */
    function filterStatus(status) {
      currentFilter = status;
      document.querySelectorAll('.status-filter-btn').forEach(btn => {
        const active = btn.dataset.status === status;
        btn.className = active
          ? 'status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-brand-dark text-white font-semibold text-xs'
          : 'status-filter-btn shrink-0 px-3 py-1.5 rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200 font-semibold text-xs';
      });
      renderOrders();
    }

    function handleSearch(val) {
      searchQuery = val.toLowerCase().trim();
      renderOrders();
    }

    /* ─── RENDER ────────────────────────────────── */
    function renderOrders() {
      const container = document.getElementById('orders-list-container');

      let filtered = allOrders.filter(o => {
        const ms = currentFilter === 'ALL' || o.status === currentFilter;
        const mq = !searchQuery
          || o.orderId.toLowerCase().includes(searchQuery)
          || o.customer?.name?.toLowerCase().includes(searchQuery)
          || o.customer?.phone?.toLowerCase().includes(searchQuery)
          || o.customer?.address?.toLowerCase().includes(searchQuery);
        return ms && mq;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="clean-card p-10 text-center text-stone-400 rounded-3xl">
            <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 text-stone-300"></i>
            <h3 class="font-heading font-bold text-base text-brand-dark">No Orders Found</h3>
            <p class="text-xs text-stone-500 mt-1">No orders match the current filters.</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(order => {
        const date = new Date(order.createdAt).toLocaleString();

        /* Status badge */
        const statusMap = {
          RECEIVED:   { cls: 'bg-stone-100 text-stone-700 border-stone-300',   label: '📥 Received' },
          PREPARING:  { cls: 'bg-amber-100 text-amber-800 border-amber-200',   label: '🔥 Cooking' },
          IN_TRANSIT: { cls: 'bg-blue-100 text-blue-800 border-blue-200',      label: '🚴 In Transit' },
          DELIVERED:  { cls: 'bg-emerald-100 text-emerald-800 border-emerald-200', label: '✅ Delivered' },
        };
        const sb = statusMap[order.status] || statusMap.RECEIVED;

        /* Payment badge */
        const pm = order.customer?.paymentMethod || 'card';
        const paymentBadge = pm === 'apple'
          ? `<span class="bg-stone-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">⚡ Apple Pay</span>`
          : pm === 'cash'
          ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-md">💵 Cash</span>`
          : `<span class="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded-md">💳 Card</span>`;

        /* Status button helper */
        const sBtn = (s, emoji, label) => {
          const active = order.status === s;
          const cls = active
            ? { PREPARING:'bg-amber-500 text-white', IN_TRANSIT:'bg-blue-600 text-white', DELIVERED:'bg-emerald-600 text-white', RECEIVED:'bg-stone-700 text-white' }[s]
            : 'bg-stone-100 text-stone-600 hover:bg-stone-200';
          return `<button onclick="updateStatus('${order.orderId}','${s}')"
            class="px-3 py-2 text-xs font-semibold rounded-xl transition ${cls}">${emoji} ${label}</button>`;
        };

        /* Items list */
        const itemsList = (order.items || []).map(i => `
          <div class="flex items-center justify-between py-1.5 border-b border-stone-100 last:border-none text-xs gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="shrink-0 w-5 h-5 rounded-md bg-stone-100 text-stone-700 font-bold flex items-center justify-center text-[10px]">${i.qty}x</span>
              <span class="font-medium text-brand-dark truncate">${i.name}</span>
              ${i.notes ? `<span class="text-[10px] text-stone-400 italic shrink-0">(${i.notes})</span>` : ''}
            </div>
            <span class="font-semibold text-stone-700 shrink-0">$${(i.price * i.qty).toFixed(2)}</span>
          </div>`).join('');

        return `
          <div class="clean-card rounded-2xl sm:rounded-3xl p-4 sm:p-5 shadow-sm border border-surface-border">

            <!-- Header row -->
            <div class="flex flex-col gap-2 border-b border-surface-border pb-3 mb-3">

              <!-- Order ID + badges -->
              <div class="flex flex-wrap items-center gap-2">
                <h3 class="font-heading font-extrabold text-base text-brand-dark">${order.orderId}</h3>
                <span class="border text-[10px] font-bold px-2 py-0.5 rounded-full ${sb.cls}">${sb.label}</span>
                ${paymentBadge}
              </div>

              <!-- Time -->
              <p class="text-[11px] text-stone-400 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>${date}
              </p>

              <!-- Status action buttons — wrappable -->
              <div class="status-actions">
                ${sBtn('RECEIVED',   '📥', 'Received')}
                ${sBtn('PREPARING',  '🔥', 'Cooking')}
                ${sBtn('IN_TRANSIT', '🚴', 'Transit')}
                ${sBtn('DELIVERED',  '✅', 'Delivered')}
              </div>
            </div>

            <!-- Body: stacks on mobile, side-by-side on md+ -->
            <div class="flex flex-col md:grid md:grid-cols-12 gap-3">

              <!-- Customer info -->
              <div class="md:col-span-5 bg-stone-50 p-3 rounded-xl border border-stone-200 space-y-2 text-xs">
                <div class="font-bold text-brand-dark flex items-center gap-1.5">
                  <i data-lucide="user" class="w-4 h-4 text-brand-500 shrink-0"></i>
                  <span class="truncate">${order.customer?.name || 'Customer'}</span>
                </div>
                <div class="text-stone-600 flex items-start gap-1.5">
                  <i data-lucide="map-pin" class="w-4 h-4 text-stone-400 shrink-0 mt-0.5"></i>
                  <span>${order.customer?.address || 'Standard Delivery'}</span>
                </div>
                <div class="text-stone-600 flex items-center gap-1.5">
                  <i data-lucide="phone" class="w-4 h-4 text-stone-400 shrink-0"></i>
                  <a href="tel:${order.customer?.phone}" class="hover:text-brand-500 font-mono">${order.customer?.phone || 'N/A'}</a>
                </div>
                <div class="text-stone-500 flex items-center gap-1.5 pt-1.5 border-t border-stone-200 text-[11px]">
                  <i data-lucide="bike" class="w-3.5 h-3.5 text-brand-accent shrink-0"></i>
                  <span>Courier: <strong>${order.courier?.name || 'Marcus B.'}</strong></span>
                </div>
              </div>

              <!-- Items + pricing -->
              <div class="md:col-span-7 flex flex-col gap-2">
                <div class="bg-white p-3 rounded-xl border border-stone-200">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400 block mb-1.5">Ordered Dishes</span>
                  ${itemsList}
                </div>

                <!-- Financials: wrappable row -->
                <div class="fin-row bg-stone-50 px-3 py-2.5 rounded-xl border border-stone-200 text-[11px]">
                  <div class="flex flex-wrap gap-x-4 gap-y-1 text-stone-500">
                    <span>Sub: <strong>$${(order.pricing?.subtotal || 0).toFixed(2)}</strong></span>
                    <span>Tax: <strong>$${(order.pricing?.tax || 0).toFixed(2)}</strong></span>
                    <span>Tip: <strong>$${(order.pricing?.tip || 0).toFixed(2)}</strong></span>
                  </div>
                  <div class="flex items-center gap-1">
                    <span class="text-[10px] text-stone-400 uppercase font-bold">Total:</span>
                    <span class="font-heading font-extrabold text-sm text-brand-500">$${(order.pricing?.grandTotal || 0).toFixed(2)}</span>
                  </div>
                </div>
              </div>

            </div>
          </div>`;
      }).join('');

      lucide.createIcons();
    }

    /* ─── STATUS UPDATE ─────────────────────────── */
    async function updateStatus(orderId, status) {
      try {
        const res  = await fetch(`${API_BASE}/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        if (data.success) {
          const idx = allOrders.findIndex(o => o.orderId === orderId);
          if (idx > -1) allOrders[idx].status = status;
          updateMetrics();
          renderOrders();
        }
      } catch (err) {
        console.error('Status update failed:', err);
      }
    }

    /* ─── AUTH ──────────────────────────────────── */
    function checkAdminAuth() {
      const token  = sessionStorage.getItem('bistro_admin_token');
      const modal  = document.getElementById('admin-auth-modal');
      if (!token) {
        modal.classList.remove('hidden'); modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');    modal.classList.remove('flex');
        fetchOrders();
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const input  = document.getElementById('admin-passcode-input');
      const errBox = document.getElementById('admin-auth-error');
      const password = input.value.trim();
      errBox.classList.add('hidden');

      try {
        const res  = await fetch(`${API_BASE}/api/auth/admin-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.success && data.adminToken) {
          sessionStorage.setItem('bistro_admin_token', data.adminToken);
          checkAdminAuth();
        } else {
          errBox.textContent = data.error || 'Access denied.';
          errBox.classList.remove('hidden');
        }
      } catch {
        if (password === 'bistro2026') {
          sessionStorage.setItem('bistro_admin_token', 'adm_demo');
          checkAdminAuth();
        } else {
          errBox.textContent = 'Access denied. Incorrect passcode.';
          errBox.classList.remove('hidden');
        }
      }
    }

    function adminLogout() {
      sessionStorage.removeItem('bistro_admin_token');
      checkAdminAuth();
    }
  </script>
</body>
</html>
